name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  linux_x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Build Linux executable
        run: bash tools/build_executable.sh
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Linux_x64
          path: dist/RiiTag-RPC_Linux_x64

  linux_arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build on ARM64 using arm-runner
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a53
          cpu_info: cpuinfo/raspberrypi_4b
          bind_mount_repository: true
          commands: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 python3-venv python3-full
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller
            pyinstaller --onefile \
              --name "RiiTag-RPC_Linux_ARM64" \
              --add-data "banner.txt:." \
              --add-data "config.json:." \
              start.py
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Linux_ARM64
          path: dist/RiiTag-RPC_Linux_ARM64

  macos_x64:
    name: Build macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
          key: macos-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            macos-pip-
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Install PyInstaller
        run: |
          source .venv/bin/activate
          pip install pyinstaller
      - name: Build macOS executable
        run: |
          source .venv/bin/activate
          pyinstaller --onefile --name "RiiTag-RPC_MacOS_x64" --add-data "banner.txt:." --add-data "config.json:." start.py
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_MacOS_x64
          path: dist/RiiTag-RPC_MacOS_x64

  windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup venv
        run: |
          python -m venv .venv
      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Install PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pip install pyinstaller
      - name: Build Windows executable
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pyinstaller --onefile --name "RiiTag-RPC_Windows_x64" --add-data "banner.txt;." --add-data "config.json;." start.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Windows_x64
          path: dist/RiiTag-RPC_Windows_x64.exe

  macos_arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
          key: macos-arm64-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            macos-arm64-pip-
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Install PyInstaller
        run: |
          source .venv/bin/activate
          pip install pyinstaller
      - name: Build macOS ARM64 executable
        run: |
          source .venv/bin/activate
          pyinstaller --onefile --name "RiiTag-RPC_MacOS_ARM64" --add-data "banner.txt:." --add-data "config.json:." start.py
      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_MacOS_ARM64
          path: dist/RiiTag-RPC_MacOS_ARM64

  windows_arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup venv
        run: |
          python -m venv .venv
      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Install PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pip install pyinstaller
      - name: Build Windows ARM64 executable
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pyinstaller --onefile --name "RiiTag-RPC_Windows_ARM64" --add-data "banner.txt;." --add-data "config.json;." start.py
      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Windows_ARM64
          path: dist/RiiTag-RPC_Windows_ARM64.exe

  Publish_and_Release:
    name: Publish and Release (All Artifacts)
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux_x64
      - linux_arm64
      - macos_x64
      - macos_arm64
      - windows_x64
      - windows_arm64
    steps:
      - uses: actions/checkout@v6
      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_Linux_x64
          path: releases
        continue-on-error: true
      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_Linux_ARM64
          path: releases
        continue-on-error: true
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_MacOS_x64
          path: releases
        continue-on-error: true
      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_MacOS_ARM64
          path: releases
        continue-on-error: true
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_Windows_x64
          path: releases
        continue-on-error: true
      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: RiiTag-RPC_Windows_ARM64
          path: releases
        continue-on-error: true
      - name: Check for artifacts
        id: check
        run: |
          if ls releases/* 1> /dev/null 2>&1; then echo "artifact_exists=true" >> $GITHUB_OUTPUT; else echo "artifact_exists=false" >> $GITHUB_OUTPUT; fi
      - name: List files
        run: ls -la releases/ || true
      - name: Set up release metadata
        run: |
          echo "REPOSITORY_NAME=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_ENV
          echo "DATETIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
      - name: Create tag
        if: steps.check.outputs.artifact_exists == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
          git push origin ${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
