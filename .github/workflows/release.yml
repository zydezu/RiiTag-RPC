name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.9)"
        required: true

      release_type:
        description: "Release type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - prerelease
          - draft

      changelog:
        description: "Release notes / changelog"
        required: false

jobs:
  linux_x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Build Linux executable
        run: bash tools/build_executable.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Linux_x64
          path: dist/RiiTag-RPC_Linux_x64

  linux_arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build on ARM64 using arm-runner
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a53
          cpu_info: cpuinfo/raspberrypi_4b
          bind_mount_repository: true
          commands: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 python3-venv python3-full
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller

            pyinstaller --onefile \
              --name "RiiTag-RPC_Linux_ARM64" \
              --add-data "banner.txt:." \
              --add-data "config.json:." \
              start.py

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Linux_ARM64
          path: dist/RiiTag-RPC_Linux_ARM64

  macos_universal2:
    name: Build macOS Universal2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install universal2 Python from python.org
        run: |
          set -euo pipefail
          for PY_VER in 3.13.7 3.13.6 3.13.5 3.13.1 3.13.0 3.12.8; do
            URL="https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
            echo "Trying ${URL}..."
            if curl -fsSL -o python.pkg "$URL"; then
              echo "PY_VER=${PY_VER}" >> "$GITHUB_ENV"
              echo "PY_MAJOR_MINOR=${PY_VER%.*}" >> "$GITHUB_ENV"
              break
            fi
          done
          test -f python.pkg
          sudo installer -pkg python.pkg -target /

      - name: Verify the interpreter is universal2
        run: |
          PYBIN="/Library/Frameworks/Python.framework/Versions/${PY_MAJOR_MINOR}/bin/python3"
          echo "$PYBIN"
          lipo -archs "/Library/Frameworks/Python.framework/Versions/${PY_MAJOR_MINOR}/Python"
          echo "PYBIN=${PYBIN}" >> "$GITHUB_ENV"

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: macos-universal2-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: macos-universal2-pip-

      - name: Install dependencies
        run: |
          "$PYBIN" -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          source .venv/bin/activate
          pip install pyinstaller

      - name: Build macOS universal2 executable
        run: |
          source .venv/bin/activate
          pyinstaller --onefile --target-architecture universal2 \
            --name "RiiTag-RPC_MacOS_Universal2" \
            --add-data "banner.txt:." \
            --add-data "config.json:." \
            start.py

      - name: Verify the built binary is universal2
        run: lipo -archs dist/RiiTag-RPC_MacOS_Universal2

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_MacOS_Universal2
          path: dist/RiiTag-RPC_MacOS_Universal2

  windows_x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup venv
        run: python -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pyinstaller --onefile \
            --name "RiiTag-RPC_Windows_x64" \
            --add-data "banner.txt;." \
            --add-data "config.json;." \
            start.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Windows_x64
          path: dist/RiiTag-RPC_Windows_x64.exe

  windows_arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup venv
        run: python -m venv .venv

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pip install pyinstaller

      - name: Build Windows ARM64 executable
        shell: pwsh
        run: |
          .\.venv\Scripts\activate.ps1
          pyinstaller --onefile \
            --name "RiiTag-RPC_Windows_ARM64" \
            --add-data "banner.txt;." \
            --add-data "config.json;." \
            start.py

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiiTag-RPC_Windows_ARM64
          path: dist/RiiTag-RPC_Windows_ARM64.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs:
      - linux_x64
      - linux_arm64
      - macos_universal2
      - windows_x64
      - windows_arm64

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: releases
          merge-multiple: true

      - name: List artifacts
        run: ls -la releases/

      - name: Create GitHub release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          ARGS=(
            "$TAG"
            releases/*
            --title "RiiTag-RPC $TAG"
          )

          if [ -n "$CHANGELOG" ]; then
            ARGS+=(--notes "$CHANGELOG")
          else
            ARGS+=(--generate-notes)
          fi

          case "$RELEASE_TYPE" in
            prerelease)
              ARGS+=(--prerelease)
              ;;

            draft)
              ARGS+=(--draft)
              ;;

            release)
              ;;

            *)
              echo "Invalid release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          gh release create "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
